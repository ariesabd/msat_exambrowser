name: msat_exambrowser
description: Official ExamBrowser for MSAT CBT System.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_inappwebview: ^6.0.0
  flutter_windowmanager: ^0.2.0
  url_launcher: ^6.2.0
  wakelock_plus: ^1.1.4
  http: ^1.2.0
  kiosk_mode: ^0.3.0
  audioplayers: ^5.2.1
  audio_session: ^0.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/alert.mp3
    - assets/logo.png
