name: Build MSAT APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Project
        run: |
          # Melengkapi struktur folder Flutter di server
          flutter create . --platforms android
          
          # Tanam Fitur Anti-Screenshot langsung ke Jantung Android (MainActivity)
          cat <<EOF > android/app/src/main/kotlin/com/example/msat_exambrowser/MainActivity.kt
          package com.example.msat_exambrowser
          import android.view.WindowManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  super.configureFlutterEngine(flutterEngine)
              }
          }
          EOF

          # Memastikan versi SDK sesuai untuk WebView
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_1_8/g' android/app/build.gradle.kts
            sed -i 's/jvmTarget = "17"/jvmTarget = "1.8"/g' android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          # Tambahan: Memperbaiki ketidakkonsistenan versi Java/Kotlin (JVM Target)
          if [ -f android/build.gradle.kts ]; then
            echo "tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach { kotlinOptions.jvmTarget = \"1.8\" }" >> android/build.gradle.kts
          fi
          
      - name: Download Dependencies
        run: flutter pub get

      - name: Universal Plugin Patch (Namespace Fix)
        run: |
          # Skrip sakti untuk memperbaiki SEMUA library yang tidak punya namespace
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" | while read -r file; do
            if ! grep -q "namespace" "$file"; then
              # Cari nama paket dari AndroidManifest.xml
              MANIFEST_PATH="$(dirname "$file")/src/main/AndroidManifest.xml"
              if [ -f "$MANIFEST_PATH" ]; then
                PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_PATH" | head -1)
                if [ -n "$PACKAGE_NAME" ]; then
                  echo "Patching namespace for $PACKAGE_NAME in $file"
                  sed -i "s/android {/android {\n    namespace \"$PACKAGE_NAME\"/" "$file"
                fi
              fi
            fi
          done

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xambro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
