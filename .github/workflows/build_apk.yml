name: Build MSAT APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Dependencies
        run: flutter pub get

      - name: Initialize Android Folder
        run: flutter create . --platforms android --org com.msat

      - name: Generate App Icons
        run: |
          # Pastikan file logo ada
          ls -l assets/logo.png
          # Gunakan perintah dart run
          dart run flutter_launcher_icons

      - name: Configure Android Native
        run: |
          # Hapus folder default yang dibuat flutter (com.msat.msat_exambrowser) agar tidak konflik
          rm -rf android/app/src/main/kotlin/com/msat/msat_exambrowser
          
          # Pastikan folder paket baru ada
          mkdir -p android/app/src/main/kotlin/com/msat/exambrowser

          # Tanam Fitur Anti-Screenshot langsung ke Jantung Android (MainActivity)
          cat <<EOF > android/app/src/main/kotlin/com/msat/exambrowser/MainActivity.kt
          package com.msat.exambrowser
          import android.view.WindowManager
          import android.view.View
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  hideSystemUI()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) {
                      hideSystemUI()
                  }
              }

              private fun hideSystemUI() {
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                  )
                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
              }
          }
          EOF

          # Ganti Nama Aplikasi yang muncul di HP
          sed -i 's/android:label=".*"/android:label="MSAT"/' android/app/src/main/AndroidManifest.xml

          # Tambahkan Izin Kamera untuk Scan QR
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

          # Memastikan versi SDK sesuai untuk WebView
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = .*/applicationId = "com.msat.exambrowser"/' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
            sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_1_8/g' android/app/build.gradle.kts
            sed -i 's/jvmTarget = "17"/jvmTarget = "1.8"/g' android/app/build.gradle.kts
          else
            sed -i 's/applicationId ".*"/applicationId "com.msat.exambrowser"/' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          # Tambahan: Paksa abaikan error perbedaan versi Java/Kotlin agar build lanjut terus
          echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties

      - name: Universal Plugin Patch (Namespace Fix)
        run: |
          # Skrip sakti untuk memperbaiki SEMUA library yang tidak punya namespace
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" | while read -r file; do
            if ! grep -q "namespace" "$file"; then
              # Cari nama paket dari AndroidManifest.xml
              MANIFEST_PATH="$(dirname "$file")/src/main/AndroidManifest.xml"
              if [ -f "$MANIFEST_PATH" ]; then
                PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_PATH" | head -1)
                if [ -n "$PACKAGE_NAME" ]; then
                  echo "Patching namespace & SDK for $PACKAGE_NAME in $file"
                  sed -i "s/android {/android {\n    namespace \"$PACKAGE_NAME\"/" "$file"
                  
                  # Paksa semua library pakai SDK 34 agar tidak error lStar
                  sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' "$file"
                  sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' "$file"
                  sed -i 's/compileSdk = .*/compileSdk = 34/' "$file"
                  sed -i 's/targetSdk = .*/targetSdk = 34/' "$file"
                fi
              fi
            fi
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xambro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
