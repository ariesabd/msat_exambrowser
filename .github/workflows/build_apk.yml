name: Build MSAT APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Dependencies
        run: flutter pub get

      - name: Initialize Android Folder
        run: flutter create . --platforms android --org com.msat

      - name: Generate App Icons
        run: |
          # Pastikan file logo ada
          ls -l assets/logo.png
          # Gunakan perintah dart run
          dart run flutter_launcher_icons

      - name: Configure Android Native
        run: |
          # 1. Tentukan nama paket
          OLD_PKG="com.msat.msat_exambrowser"
          NEW_PKG="com.msat.exambrowser"
          NEW_PATH="android/app/src/main/kotlin/com/msat/exambrowser"

          # 2. Hapus total folder lama agar tidak konflik
          rm -rf android/app/src/main/kotlin/com/msat/msat_exambrowser
          mkdir -p $NEW_PATH

          # 3. Tanam MainActivity.kt yang baru
          cat <<EOF > $NEW_PATH/MainActivity.kt
          package com.msat.exambrowser
          import io.flutter.embedding.android.FlutterActivity
          import android.os.Bundle
          import android.view.WindowManager
          import android.view.View

          class MainActivity: FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // Fitur Keamanan: Anti Screenshot & Record
                  window.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
              }
          }
          EOF

          # 4. Ganti Nama Aplikasi & Label
          sed -i 's/android:label=".*"/android:label="MSAT"/' android/app/src/main/AndroidManifest.xml

          # 5. GLOBAL REPLACE: Ganti semua kemunculan paket lama ke paket baru di SELURUH folder android
          find android -type f -exec sed -i "s/$OLD_PKG/$NEW_PKG/g" {} + || true

          # 6. Tambahkan Izin Kamera
          sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' android/app/src/main/AndroidManifest.xml

          # 7. Paksa Namespace & SDK di build.gradle
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/namespace = .*/namespace = "'$NEW_PKG'"/' android/app/build.gradle.kts
            sed -i 's/applicationId = .*/applicationId = "'$NEW_PKG'"/' android/app/build.gradle.kts
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
          else
            sed -i 's/namespace ".*"/namespace "'$NEW_PKG'"/' android/app/build.gradle || echo 'namespace "'$NEW_PKG'"' >> android/app/build.gradle
            sed -i 's/applicationId ".*"/applicationId "'$NEW_PKG'"/' android/app/build.gradle
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi

          # Tambahan: Paksa abaikan error perbedaan versi Java/Kotlin agar build lanjut terus
          echo "kotlin.jvm.target.validation.mode=ignore" >> android/gradle.properties

      - name: Universal Plugin Patch (Namespace Fix)
        run: |
          # Skrip sakti untuk memperbaiki SEMUA library yang tidak punya namespace
          find /home/runner/.pub-cache/hosted/pub.dev -name "build.gradle" | while read -r file; do
            if ! grep -q "namespace" "$file"; then
              # Cari nama paket dari AndroidManifest.xml
              MANIFEST_PATH="$(dirname "$file")/src/main/AndroidManifest.xml"
              if [ -f "$MANIFEST_PATH" ]; then
                PACKAGE_NAME=$(grep -oP 'package="\K[^"]+' "$MANIFEST_PATH" | head -1)
                if [ -n "$PACKAGE_NAME" ]; then
                  echo "Patching namespace & SDK for $PACKAGE_NAME in $file"
                  sed -i "s/android {/android {\n    namespace \"$PACKAGE_NAME\"/" "$file"
                  
                  # Paksa semua library pakai SDK 34 agar tidak error lStar
                  sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' "$file"
                  sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' "$file"
                  sed -i 's/compileSdk = .*/compileSdk = 34/' "$file"
                  sed -i 's/targetSdk = .*/targetSdk = 34/' "$file"
                fi
              fi
            fi
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xambro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
