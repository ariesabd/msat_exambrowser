name: Build MSAT APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Project
        run: |
          # Melengkapi struktur folder Flutter di server
          flutter create . --platforms android
          
          # Memastikan versi SDK sesuai untuk WebView
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle.kts
          else
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
          fi
          
      - name: Download Dependencies
        run: flutter pub get

      - name: Patch Problematic Plugins (Namespace Fix)
        run: |
          # Memperbaiki error 'Namespace not specified' pada library flutter_windowmanager
          FILE_PATH="/home/runner/.pub-cache/hosted/pub.dev/flutter_windowmanager-0.2.0/android/build.gradle"
          if [ -f "$FILE_PATH" ]; then
            sed -i 's/android {/android {\n    namespace "io.github.m_asaba.flutter_windowmanager"/' "$FILE_PATH"
          fi

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xambro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
