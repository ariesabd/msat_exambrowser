name: Build MSAT Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Windows Project
        run: |
          # Inisialisasi folder windows jika belum ada
          flutter create . --platforms windows --org com.msat
          
          # Ganti nama file EXE menjadi MSAT
          (Get-Content windows\CMakeLists.txt) -replace 'set\(BINARY_NAME "msat_exambrowser"\)', 'set(BINARY_NAME "MSAT")' | Set-Content windows\CMakeLists.txt
          
          # Bersihkan build lama
          flutter clean
          
      - name: Download Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Zip Release
        run: |
          # Masuk ke folder hasil build dan bungkus jadi ZIP
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath MSAT-ExamBrowser-Windows.zip

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSAT-Windows-EXE
          path: MSAT-ExamBrowser-Windows.zip
